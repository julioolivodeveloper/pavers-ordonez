<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="images/logo.png">
<title>Message Sent | Pavers Ordonez</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;background:#1A2332;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}
.card{background:#1C2A3A;border-radius:20px;padding:56px 48px;text-align:center;max-width:520px;width:100%;border:1px solid rgba(255,255,255,.08)}
.icon{width:80px;height:80px;background:rgba(37,211,102,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;font-size:2.2rem;color:#25D366}
h1{font-family:'Oswald',sans-serif;font-size:2rem;color:#fff;margin-bottom:12px}
p{color:rgba(255,255,255,.65);font-size:1rem;line-height:1.7;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:6px;font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;background:#C85A2A;color:#fff;transition:all .3s ease}
.btn:hover{background:#E07040;transform:translateY(-2px)}
.sub{margin-top:20px;font-size:.85rem;color:rgba(255,255,255,.35)}
.sub a{color:#C85A2A}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><i class="fas fa-check"></i></div>
  <h1>Message Sent!</h1>
  <p>Thank you for contacting Pavers Ordonez. We received your request and will get back to you within <strong style="color:#fff">24 hours</strong> with a detailed estimate.</p>
  <a href="/" class="btn"><i class="fas fa-home"></i> Back to Home</a>
  <p class="sub">Questions? Call us at <a href="tel:5619701917">(561) 970-1917</a></p>
</div>
</body>
</html>
