<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Paver walkway and path installation in West Palm Beach, FL. Front entry, garden paths, side yard walkways. Call Pavers Ordonez (561) 970-1917.">
<title>Walkways & Paths Pavers | Pavers Ordonez — West Palm Beach, FL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#1A2332;--dark2:#243040;--terra:#C85A2A;--terra-l:#E07040;--amber:#F4A832;--amber-l:#F7BE62;--white:#fff;--off:#FAF8F5;--stone:#F0EDE8;--gray:#6C757D;--tr:all .3s ease;--sh:0 10px 40px rgba(0,0,0,.12);--sh2:0 20px 60px rgba(0,0,0,.2);}
html{scroll-behavior:smooth}body{font-family:'Open Sans',sans-serif;color:var(--dark);background:var(--white);overflow-x:hidden;line-height:1.7}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;font-weight:700;line-height:1.15;letter-spacing:.5px}img{max-width:100%;display:block}a{text-decoration:none}
a[href^="tel"]:not(.btn),a[href^="sms"]:not(.btn){color:inherit}
.nav{position:fixed;top:0;width:100%;z-index:1000;background:var(--dark);padding:14px 0;box-shadow:0 5px 30px rgba(0,0,0,.3)}
.nav-in{max-width:1200px;margin:0 auto;padding:0 30px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:42px;height:42px;background:var(--terra);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.logo-b{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:#fff;letter-spacing:1px;line-height:1;display:block}
.logo-t{font-size:10px;color:var(--amber-l);letter-spacing:2px;text-transform:uppercase}
.nav-links{display:flex;align-items:center;gap:28px;list-style:none}
.nav-links a{color:rgba(255,255,255,.8);font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;transition:var(--tr)}
.nav-links a:hover{color:#fff}.nav-cta{background:var(--terra)!important;color:#fff!important;padding:9px 20px;border-radius:4px}.nav-cta:hover{background:var(--terra-l)!important}
/* DROPDOWN */
.nav-dropdown{position:relative}
.nav-dropdown>a{display:flex;align-items:center;gap:5px}
.nav-dropdown>a .dd-arrow{font-size:.6rem;transition:transform .25s ease}
.nav-dropdown:hover>a .dd-arrow{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 18px);left:50%;transform:translateX(-50%);background:#1C2E42;border-radius:10px;min-width:210px;box-shadow:0 15px 50px rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease,top .22s ease;border:1px solid rgba(255,255,255,.07);padding:8px 0;z-index:1001}
.nav-dropdown:hover .dropdown-menu{opacity:1;visibility:visible;top:calc(100% + 10px)}
.dropdown-menu a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:rgba(255,255,255,.78);font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;transition:var(--tr);white-space:nowrap}
.dropdown-menu a:hover{color:#fff;background:rgba(200,90,42,.14);padding-left:22px}
.dropdown-menu a i{color:var(--terra);font-size:.85rem;width:14px;flex-shrink:0}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer}.burger span{display:block;width:25px;height:2px;background:#fff;transition:var(--tr)}
.page-hero{position:relative;padding:140px 30px 80px;overflow:hidden;min-height:420px;display:flex;align-items:center}
.page-hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.4);opacity:0;transition:opacity 1.5s ease}
.page-hero-slide.active{opacity:1}
.typed-wrap{display:inline-block;min-height:1.15em}
.typed-text{color:var(--terra);transition:color .3s}
.typed-cursor{display:inline-block;width:3px;background:var(--terra);margin-left:3px;animation:typedBlink .75s step-end infinite;vertical-align:baseline;height:.9em;border-radius:1px}
@keyframes typedBlink{0%,100%{opacity:1}50%{opacity:0}}
.page-hero-ov{position:absolute;inset:0;background:linear-gradient(135deg,rgba(26,35,50,.95) 0%,rgba(200,90,42,.2) 100%)}
.page-hero-c{position:relative;max-width:1200px;margin:0 auto;width:100%}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:.8rem;color:rgba(255,255,255,.5);font-family:'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase}
.breadcrumb a{color:rgba(255,255,255,.5);transition:var(--tr)}.breadcrumb a:hover{color:var(--terra)}.breadcrumb i{font-size:.6rem}
.page-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(200,90,42,.15);border:1px solid var(--terra);color:var(--amber-l);padding:7px 16px;border-radius:30px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px}
.page-hero h1{font-size:clamp(2.2rem,5vw,3.8rem);color:#fff;margin-bottom:16px;max-width:700px}
.page-hero h1 span{color:var(--terra)}
.page-hero p{font-size:1.05rem;color:rgba(255,255,255,.75);max-width:560px;margin-bottom:30px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:4px;font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;transition:var(--tr);cursor:pointer;border:none}
.btn-primary{background:var(--terra);color:#fff}.btn-primary:hover{background:var(--terra-l);transform:translateY(-2px);box-shadow:0 8px 25px rgba(200,90,42,.4)}
.btn-outline{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.45)}.btn-outline:hover{border-color:#fff;background:rgba(255,255,255,.08);transform:translateY(-2px)}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.sec{padding:80px 30px}.sec-in{max-width:1200px;margin:0 auto}
.sec-label{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:10px;display:block}
.sec-title{font-size:clamp(1.7rem,3.5vw,2.5rem);color:var(--dark);margin-bottom:16px}.sec-title span{color:var(--terra)}
.sec-sub{font-size:1rem;color:var(--gray);line-height:1.85}
.overview{background:var(--off)}.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.ov-img{position:relative;border-radius:14px;overflow:hidden;height:460px}
.ov-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.check-list{display:flex;flex-direction:column;gap:14px;margin-bottom:32px}
.check-item{display:flex;align-items:flex-start;gap:14px}
.check-item i{color:var(--terra);font-size:1rem;margin-top:4px;flex-shrink:0}
.check-item span{font-size:.95rem;color:#444;line-height:1.7}
.types{background:#fff}
.types-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;margin-top:48px}
.type-card{background:var(--off);border-radius:12px;padding:30px 24px;text-align:center;border-bottom:4px solid transparent;transition:var(--tr)}
.type-card:hover{border-bottom-color:var(--terra);transform:translateY(-4px);box-shadow:var(--sh)}
.type-card i{font-size:2.2rem;color:var(--terra);margin-bottom:16px}
.type-card h3{font-size:1.05rem;color:var(--dark);margin-bottom:10px}
.type-card p{font-size:.88rem;color:var(--gray);line-height:1.7}
.ben-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:28px;margin-top:50px}
.ben-card{padding:32px 28px;border-radius:12px;background:var(--off);border-top:4px solid var(--terra);transition:var(--tr)}
.ben-card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.ben-icon{width:52px;height:52px;background:rgba(200,90,42,.1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--terra);margin-bottom:18px}
.ben-card h3{font-size:1.1rem;color:var(--dark);margin-bottom:10px}
.ben-card p{font-size:.9rem;color:var(--gray);line-height:1.75}
.gallery{background:var(--off)}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gal-item{border-radius:10px;overflow:hidden;height:240px;position:relative}
.gal-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.gal-item:hover img{transform:scale(1.05)}
.gal-overlay{position:absolute;inset:0;background:rgba(200,90,42,0);transition:var(--tr)}
.gal-item:hover .gal-overlay{background:rgba(200,90,42,.2)}
.process{background:#fff}.proc-steps{display:flex;flex-direction:column;gap:0;margin-top:48px;max-width:760px}
.proc-step{display:flex;gap:28px;align-items:flex-start;position:relative;padding-bottom:36px}
.proc-step:last-child{padding-bottom:0}
.proc-step::before{content:'';position:absolute;left:22px;top:50px;bottom:0;width:2px;background:linear-gradient(180deg,var(--terra),rgba(200,90,42,.1));z-index:0}
.proc-step:last-child::before{display:none}
.step-num{width:46px;height:46px;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:1.1rem;font-weight:700;color:#fff;flex-shrink:0;z-index:1}
.step-body h4{font-size:1.1rem;color:var(--dark);margin-bottom:8px}
.step-body p{font-size:.92rem;color:var(--gray);line-height:1.75}
.faq{background:var(--off)}.faq-list{display:flex;flex-direction:column;gap:16px;margin-top:48px;max-width:820px}
.faq-item{background:#fff;border-radius:10px;border-left:4px solid var(--terra);overflow:hidden}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:1.05rem;color:var(--dark);font-weight:600;gap:16px}
.faq-q i{color:var(--terra);flex-shrink:0;transition:var(--tr)}.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease}
.faq-a p{padding:0 24px 20px;font-size:.92rem;color:var(--gray);line-height:1.8}
.faq-item.open .faq-q i{transform:rotate(180deg)}.faq-item.open .faq-a{max-height:200px}
.cta-sec{background:linear-gradient(135deg,var(--terra) 0%,#9A3E18 100%);padding:70px 30px;text-align:center}
.cta-sec h2{font-size:clamp(1.7rem,3.5vw,2.5rem);color:#fff;margin-bottom:14px}
.cta-sec p{color:rgba(255,255,255,.85);font-size:1rem;max-width:500px;margin:0 auto 30px}
.cta-btns{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.btn-white{background:#fff;color:var(--terra)}.btn-white:hover{background:var(--off);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.2)}
.btn-outline-white{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6)}.btn-outline-white:hover{border-color:#fff;background:rgba(255,255,255,.1);transform:translateY(-2px)}
footer{background:#0D1520;padding:36px 30px 24px}
.footer-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px}
.footer-copy{font-size:.8rem;color:rgba(255,255,255,.35);text-align:center}
.footer-links{display:flex;gap:24px}.footer-links a{font-size:.8rem;color:rgba(255,255,255,.4);transition:var(--tr)}.footer-links a:hover{color:var(--terra)}
@media(max-width:900px){.ov-grid{grid-template-columns:1fr}.ov-img{height:280px}.gal-grid{grid-template-columns:1fr 1fr}.nav-links{display:none;position:fixed;top:0;right:0;bottom:0;width:260px;background:var(--dark);flex-direction:column;align-items:flex-start;padding:90px 30px 40px;gap:8px;transform:translateX(100%);transition:transform .3s ease}.nav-links.open{display:flex;transform:translateX(0)}.nav-links li{width:100%}.nav-links a{font-size:17px;padding:10px 0;display:block;border-bottom:1px solid rgba(255,255,255,.06)}.burger{display:flex}}
@media(max-width:600px){
  .sec{padding:56px 20px}
  .page-hero{padding:100px 20px 56px;min-height:auto}
  .page-hero h1{font-size:clamp(1.8rem,8vw,2.4rem)}
  .hero-btns{flex-direction:column;gap:12px}
  .hero-btns .btn{width:100%;justify-content:center;padding:14px 20px}
  .ov-grid{grid-template-columns:1fr}
  .ov-img{height:240px}
  .gal-grid{grid-template-columns:1fr}
  .gal-item{height:200px}
  .footer-in{flex-direction:column;align-items:center;text-align:center}
  .footer-links{flex-wrap:wrap;justify-content:center}
}.gal-grid{grid-template-columns:1fr}.gal-item{height:200px}.footer-in{flex-direction:column;align-items:center;text-align:center}}

/* Logo image */
.logo-wrap{background:#fff;border-radius:8px;padding:5px 14px;display:flex;align-items:center}
.logo-wrap img{height:48px;width:auto;display:block}
.logo-sm{padding:3px 8px}
.logo-sm img{height:34px}
</style>
</head>

<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>
AOS.init({duration:700,once:true,offset:60});
(function(){var s=document.querySelectorAll('.page-hero-slide');if(s.length<2)return;var c=0;setInterval(function(){s[c].classList.remove('active');c=(c+1)%s.length;s[c].classList.add('active');},5000);})();
(function(){var phrases=['Walkways & Paths','Garden Pathways','Elegant Entrances','Custom Border Design'];var el=document.getElementById('typedText');var idx=0,charIdx=0,deleting=false,pauseTick=0;var PAUSE=52,TYPE_SPD=68,DEL_SPD=38;function tick(){var phrase=phrases[idx];if(pauseTick>0){pauseTick--;setTimeout(tick,TYPE_SPD);return;}if(!deleting){el.textContent=phrase.slice(0,charIdx+1);charIdx++;if(charIdx===phrase.length){pauseTick=PAUSE;deleting=true;setTimeout(tick,TYPE_SPD);return;}}else{el.textContent=phrase.slice(0,charIdx-1);charIdx--;if(charIdx===0){deleting=false;idx=(idx+1)%phrases.length;pauseTick=12;}}setTimeout(tick,deleting?DEL_SPD:TYPE_SPD);}setTimeout(tick,600);})();
// Mobile dropdown
document.querySelectorAll(".nav-dropdown>a").forEach(function(a){a.addEventListener("click",function(e){var isMobile=window.innerWidth<=900;if(isMobile){e.preventDefault();var menu=this.nextElementSibling;var open=menu.style.opacity==="1";document.querySelectorAll(".dropdown-menu").forEach(function(m){m.style.opacity="0";m.style.visibility="hidden"});if(!open){menu.style.opacity="1";menu.style.visibility="visible";menu.style.top="calc(100% + 10px)"}}})});
function toggleNav(){document.getElementById('navLinks').classList.toggle('open');}
function toggleFaq(el){const item=el.parentElement;document.querySelectorAll('.faq-item').forEach(i=>{if(i!==item)i.classList.remove('open')});item.classList.toggle('open');}
</script>
